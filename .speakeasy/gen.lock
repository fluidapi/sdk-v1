examples:
  healthCheck:
    speakeasy-default-health-check:
      responses:
        "200":
          application/json: {"status": "UP"}
        "503":
          application/json: {"ok": false, "error": {"code": "<value>", "message": "<value>"}}
  getJWKS:
    speakeasy-default-get-JWKS:
      responses:
        "200":
          application/json: {"keys": []}
        "503":
          application/json: {"ok": false, "error": {"code": "<value>", "message": "<value>"}}
  issueM2MToken:
    speakeasy-default-issue-m2-M-token:
      requestBody:
        application/x-www-form-urlencoded: {"grant_type": "client_credentials", "client_id": "fld-cred-acme-corp--api--postman-primary", "client_secret": "dGhpcyBpcyBhIHNlY3JldA", "scope": "fluid:api"}
      responses:
        "200":
          application/json: {"access_token": "<value>", "token_type": "Bearer", "expires_in": 3600, "scope": "fluid:api"}
        "400":
          application/json: {"error": "invalid_client", "error_description": "invalid client credentials"}
        "502":
          application/json: {"error": "invalid_client", "error_description": "invalid client credentials"}
    invalid_scope:
      requestBody:
        application/x-www-form-urlencoded: {"grant_type": "client_credentials", "client_id": "fld-cred-acme-corp--api--postman-primary", "client_secret": "dGhpcyBpcyBhIHNlY3JldA", "scope": "fluid:api"}
      responses:
        "400":
          application/json: {"error": "invalid_scope", "error_description": "scope \"admin\" is not allowed"}
        "502":
          application/json: {"error": "invalid_scope", "error_description": "scope \"admin\" is not allowed"}
    unsupported_grant_type:
      requestBody:
        application/x-www-form-urlencoded: {"grant_type": "client_credentials", "client_id": "fld-cred-acme-corp--api--postman-primary", "client_secret": "dGhpcyBpcyBhIHNlY3JldA", "scope": "fluid:api"}
