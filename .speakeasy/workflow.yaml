workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
  auth:
    inputs:
      - location: ./public.yaml
    overlays:
      - location: .speakeasy/speakeasy-modifications-overlay.yaml
    registry:
      location: registry.speakeasyapi.dev/fluid/iam-sjd/auth
  combined:
    inputs:
      - location: combined.yaml
    output: out-combined
    registry:
      location: registry.speakeasyapi.dev/fluid/iam-sjd/combined
  resources:
    inputs:
      - location: public.yaml
      - location: resources.yaml
    output: out-resources
    registry:
      location: registry.speakeasyapi.dev/fluid/iam-sjd/resources
  mock:
    inputs:
      - location: ./mock.yaml
    overlays:
      - location: public.yaml
    output: combined.yaml
targets:
  fluidapi:
    target: typescript
    source: resources
    publish:
      npm:
        token: $npm_token
